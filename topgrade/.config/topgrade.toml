[misc]
assume_yes = true
no_retry = true
pre_sudo = false
cleanup = true

# Disable steps that are slow or managed elsewhere
disable = [
  "system",      # macOS system updates - do manually
  "containers",  # No container updates needed
  "nix",         # Use `nix upgrade-nix` instead of nix-env
  "gem",         # Apple system Ruby 2.6; no Ruby development
  "ruby_gems",   # Do not sudo-upgrade the system RubyGems
]

[brew]
autoremove = true

[vim]
# Auto-detects lazy.nvim/packer/vim-plug
